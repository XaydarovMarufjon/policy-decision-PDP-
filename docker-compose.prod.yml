# Production hardening overlay. Supply required values through the deployment
# secret manager; Compose aborts before startup when any is missing.
services:
  pdp:
    ports: []
    environment:
      ALLOW_DEV_DEFAULTS: "false"
      ALLOW_CANONICAL_INPUT: "false"
      PDP_SHARED_SECRET: "${PDP_SHARED_SECRET:?PDP_SHARED_SECRET is required}"
      OPA_TIMEOUT_MS: "${OPA_TIMEOUT_MS:-2000}"
      PDP_AUDIT_REQUIRED: "${PDP_AUDIT_REQUIRED:-true}"
      PDP_AUDIT_MAX_BYTES: "${PDP_AUDIT_MAX_BYTES:-10485760}"
      PDP_AUDIT_HMAC_SECRET: "${PDP_AUDIT_HMAC_SECRET:?PDP_AUDIT_HMAC_SECRET is required}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/pdp/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  opa:
    ports: []
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail-defined", "http.send({\"method\":\"get\",\"url\":\"http://127.0.0.1:8181/health\"}).status_code == 200"]
      interval: 10s
      timeout: 3s
      retries: 5

  pep:
    environment:
      ALLOW_DEV_DEFAULTS: "false"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}"
      COOKIE_SECRET: "${COOKIE_SECRET:?COOKIE_SECRET is required}"
      PDP_SHARED_SECRET: "${PDP_SHARED_SECRET:?PDP_SHARED_SECRET is required}"
      PDP_DEBUG_RESPONSE: "false"
      PEP_OUTBOUND_TIMEOUT_MS: "${PEP_OUTBOUND_TIMEOUT_MS:-4000}"
