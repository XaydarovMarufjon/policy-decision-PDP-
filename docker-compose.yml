services:
  pdp:
    build:
      context: .
    container_name: zta-pdp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PDP_PORT: "3000"
      OPA_DECISION_URL: "http://opa:8181/v1/data/sentryx/zta/decision"
      OPA_TIMEOUT_MS: "${OPA_TIMEOUT_MS:-2000}"
      CONTEXT_SOURCE_DIR: "/app/mock-sources"
      PDP_AUDIT_LOG_PATH: "/app/audit-logs/pdp-decisions.jsonl"
      # Shared secret for X-PDP-Auth. Must match the PEP. Override in production.
      PDP_SHARED_SECRET: "${PDP_SHARED_SECRET:-pdp-dev-shared-secret}"
      # DEV stack: allow built-in dev defaults + serve the admin console, and
      # allow the canonical test path. Set both to false (or unset) in production.
      ALLOW_DEV_DEFAULTS: "${ALLOW_DEV_DEFAULTS:-true}"
      ALLOW_CANONICAL_INPUT: "${ALLOW_CANONICAL_INPUT:-true}"
      PDP_AUDIT_MAX_BYTES: "${PDP_AUDIT_MAX_BYTES:-10485760}"
      PDP_AUDIT_REQUIRED: "${PDP_AUDIT_REQUIRED:-false}"
      # Context signal sources (each pluggable; mock/opa-data by default).
      IDENTITY_MODE: "${IDENTITY_MODE:-mock}"
      RISK_MODE: "${RISK_MODE:-mock}"
      DEVICE_MODE: "${DEVICE_MODE:-mock}"
      # Resource inventory: opa-data reads opa/data/zta.json (single source of
      # truth, baked into the image). Set to mock for mock-sources/resources.json.
      RESOURCE_MODE: "${RESOURCE_MODE:-opa-data}"
      # Used only when IDENTITY_MODE=oidc (real user via IdP JWKS).
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_JWKS_URL: "${OIDC_JWKS_URL:-}"
      OIDC_JWKS_FILE: "${OIDC_JWKS_FILE:-}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-}"
      OIDC_ROLE_PRIORITY: "${OIDC_ROLE_PRIORITY:-admin,analyst,auditor,guest}"
    depends_on:
      - opa
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - pdp-audit-logs:/app/audit-logs
      # For offline OIDC testing with a local JWKS file, uncomment:
      # - ./dev-keys:/app/dev-keys:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  opa:
    image: openpolicyagent/opa:1.18.2
    container_name: zta-pe-opa
    restart: unless-stopped
    ports:
      - "8181:8181"
    volumes:
      - ./opa/policies:/policies:ro
      - ./opa/data:/data:ro
      - ./opa/config:/config:ro
      - opa-runtime:/var/opa
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "--log-format=json"
      - "--config-file=/config/opa-config.yaml"
      - "/policies"
      - "/data"

volumes:
  opa-runtime:
  pdp-audit-logs:
