services:
  pdp:
    build:
      context: .
    container_name: zta-pdp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PDP_PORT: "3000"
      OPA_DECISION_URL: "http://opa:8181/v1/data/sentryx/zta/decision"
      CONTEXT_SOURCE_DIR: "/app/mock-sources"
      PDP_AUDIT_LOG_PATH: "/app/audit-logs/pdp-decisions.jsonl"
      # Identity source for the subject: mock (default) or oidc (real JWT).
      IDENTITY_MODE: "${IDENTITY_MODE:-mock}"
      # Used only when IDENTITY_MODE=oidc (real user via IdP JWKS).
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_JWKS_URL: "${OIDC_JWKS_URL:-}"
      OIDC_JWKS_FILE: "${OIDC_JWKS_FILE:-}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-}"
      OIDC_ROLE_PRIORITY: "${OIDC_ROLE_PRIORITY:-admin,analyst,auditor,guest}"
    depends_on:
      - opa
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - pdp-audit-logs:/app/audit-logs
      # For offline OIDC testing with a local JWKS file, uncomment:
      # - ./dev-keys:/app/dev-keys:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  opa:
    image: openpolicyagent/opa:1.18.2
    container_name: zta-pe-opa
    restart: unless-stopped
    ports:
      - "8181:8181"
    volumes:
      - ./opa/policies:/policies:ro
      - ./opa/data:/data:ro
      - ./opa/config:/config:ro
      - opa-runtime:/var/opa
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "--log-format=json"
      - "--config-file=/config/opa-config.yaml"
      - "/policies"
      - "/data"

volumes:
  opa-runtime:
  pdp-audit-logs:
